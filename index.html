<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Barshat</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center">

    <main class="w-full max-w-md px-4">

        <h1 class="text-4xl font-bold text-center mb-8">
            Barshat
        </h1>

        <div class="flex gap-2 mb-6">
            <input
                id="cityInput"
                type="text"
                placeholder="Jahag ka naam "
                class="flex-1 px-4 py-3 rounded-xl bg-slate-800
                       border border-slate-700
                       focus:outline-none focus:border-blue-500"
            >

            <button
                id="searchButton"
                class="px-5 py-3 rounded-xl bg-blue-600
                       hover:bg-blue-500 transition"
            >
                ?
            </button>
        </div>

        <section
            id="weatherCard"
            class="bg-slate-800 border border-slate-700
                   rounded-2xl p-7 text-center shadow-xl"
        >

            <h2 id="cityName" class="text-2xl font-semibold">
                City
            </h2>

            <p id="temperature" class="text-6xl font-bold my-5">
                --°C
            </p>

            <p id="condition" class="text-lg text-slate-300">
                Weather condition
            </p>

            <div class="grid grid-cols-2 gap-4 mt-8">

                <div class="bg-slate-700 rounded-xl p-4">
                    <p class="text-sm text-slate-300">Humidity</p>
                    <p id="humidity" class="text-lg font-semibold mt-1">
                        --%
                    </p>
                </div>

                <div class="bg-slate-700 rounded-xl p-4">
                    <p class="text-sm text-slate-300">Wind</p>
                    <p id="wind" class="text-lg font-semibold mt-1">
                        -- km/h
                    </p>
                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
